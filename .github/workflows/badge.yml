name: Update Duolingo badge

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate badge
        env:
          DUOLINGO_JWT: ${{ secrets.DUOLINGO_JWT }}
        run: python scripts/generate_badge.py duolingo.svg duolingo-dark.svg

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add duolingo.svg duolingo-dark.svg
          git diff --cached --quiet || git commit -m "Update Duolingo badge"
          git push
